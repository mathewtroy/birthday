<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Happy Birthday</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="img/cake-icon.svg" />

    <link rel="stylesheet" href="styles.css" />
</head>
<body>

    <h1 class="title">Happy Birthday</h1>

    <!-- Music button -->
    <div class="music-container">
        <img src="img/music-icon.svg" id="musicBtn" class="music-btn" />
    </div>

    <!-- Balloons appear here -->
    <div id="balloonContainer" class="balloon-container"></div>

    <div class="center" id="pressSection">
        <img src="img/press-icon.svg" id="pressImg" class="press-img" />
        <p class="hint">Press the gift box</p>
    </div>

    <div id="gridContainer" class="grid hidden">
        <img id="anim-box" class="anim-item" />
        <img id="anim-dance1" class="anim-item" />
        <img id="anim-support" class="anim-item" />
        <img id="anim-dance2" class="anim-item" />
        <img id="anim-play" class="anim-item" />
        <img id="anim-wish" class="anim-item" />
    </div>

    <script src="script.js"></script>
</body>
</html>
